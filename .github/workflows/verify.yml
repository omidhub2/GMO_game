name: Backgammon UI checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gmo_arena
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and component tests
        run: npm test
      - name: Production build
        run: npm run build
