name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - cloudflare-clean

jobs:
  deploy:
    name: Build and deploy gmo-arena
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and deploy Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4402b88e8d51e4dec0fd6f5eacf17e93
